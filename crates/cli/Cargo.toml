[package]
name = "mergeloop-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The mergeloop command: an agent lands a PR through MergeLoop's queue."

[lib]
name = "mergeloop_cli"
path = "src/lib.rs"

[[bin]]
name = "mergeloop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
getrandom = "0.4.3"
libc = "0.2.191"
mergepatrol-git = { version = "0.1.0", path = "../git" }
mergepatrol-resolver = { version = "0.1.0", path = "../resolver" }
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = "1.2.1"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[lints]
workspace = true
